# Script to build and publish a Reloaded Mod.
# by Sewer56

# Produces: 
#   - Build to Upload to GameBanana
#   - Build to Upload to GitHub
#   - Build to Upload to NuGet
#   - Changelog

# When pushing a tag
#   - Upload to GitHub Releases
#   - Upload to Reloaded NuGet Repository (if GitHub Secret RELOADED_NUGET_KEY is specified) 

name: Build and Publish Reloaded Mod

on:
  push:
    branches: [ main ]
    tags:
      - '*'
  pull_request:
    branches: [ main ]

permissions:
  id-token: write
  contents: write

env:
  PUBLISH_BASE: ./Publish
  PUBLISH_GAMEBANANA_PATH: ToUpload/GameBanana
  PUBLISH_GITHUB_PATH: ToUpload/Generic
  PUBLISH_NUGET_PATH: ToUpload/NuGet

  P3R_PATH: P3R
  P4R_PATH: P4R

  PUBLISH_CHANGELOG_PATH: CHANGELOG.md

  RELOADEDIIMODS: .
  RELOADED_TOOLS_PATH: Tools/Reloaded-Tools

  NUGET_URL: https://api.nuget.org/v3/index.json
  # Default value is official Reloaded package server.  
  RELOADED_NUGET_URL: https://packages.sewer56.moe/v3/index.json

  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    
    steps:
    - uses: actions/checkout@v2
      with:
        fetch-depth: 0
        submodules: 'recursive'

    - name: Setup .NET Core 5.0 # For Reloaded Publisher
      uses: actions/setup-dotnet@v1.8.2
      with:
        dotnet-version: 5.0.x

    - name: Setup .NET Core 9.0 # For mods
      uses: actions/setup-dotnet@v1.8.2
      with:
        dotnet-version: 9.0.x

    - name: Build Interfaces
      run: |
        dotnet publish riri.eventframework.Interfaces -c Release --self-contained false -o "$env:PUBLISH_BASE/$env:INTERFACE_PATH" /p:OutputPath=../

    - name: Build Mods
      run: ./PublishAll.ps1
      
    - name: Upload GitHub Release Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GitHub Release # Artifact name
        path: | # A file, directory or wildcard pattern that describes what to upload
          ${{ env.PUBLISH_BASE }}/${{ env.P3R_PATH }}/${{ env.PUBLISH_GITHUB_PATH }}/*

    - name: Upload GameBanana Release Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GameBanana Release # Artifact name
        path: | # A file, directory or wildcard pattern that describes what to upload
          ${{ env.PUBLISH_BASE }}/${{ env.P3R_PATH }}/${{ env.PUBLISH_GAMEBANANA_PATH }}/*

    - name: Upload NuGet Release Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NuGet Release # Artifact name
        path: | # A file, directory or wildcard pattern that describes what to upload
          ${{ env.PUBLISH_BASE }}/${{ env.P3R_PATH }}/${{ env.PUBLISH_NUGET_PATH }}/*

    - name: Upload to GitHub Releases (on Tag)
      uses: softprops/action-gh-release@v0.1.14
      if: env.IS_RELEASE == 'true'
      with:
        # Path to load note-worthy description of changes in release from
        body_path: ${{ env.PUBLISH_CHANGELOG_PATH }}
        # Newline-delimited list of path globs for asset files to upload
        files: |
          ${{ env.PUBLISH_BASE }}/${{ env.P3R_PATH }}/${{ env.PUBLISH_GITHUB_PATH }}/*

    - name: Login to NuGet (on Tag)
      uses: NuGet/login@v1
      if: env.IS_RELEASE == 'true'
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Push Dependencies to NuGet (on Tag)
      if: env.IS_RELEASE == 'true'
      run: |
        if ([string]::IsNullOrEmpty("${{ steps.login.outputs.NUGET_API_KEY }}"))
        {
            Write-Host "Could not retrieve the NuGet key, skipping."
            return
        }
        $Items = Get-ChildItem -Path "$env:PUBLISH_BASE/*.nupkg"
        dotnet nuget push "$Items" -k "${{ steps.login.outputs.NUGET_API_KEY }}" -s "${{ env.NUGET_URL }}" --skip-duplicate

    - name: Push Mods to Reloaded NuGet (on Tag)
      env: 
        RELOADED_NUGET_KEY: ${{ secrets.RELOADED_NUGET_KEY }}
      if: env.IS_RELEASE == 'true'
      run: |
        if ([string]::IsNullOrEmpty("$env:RELOADED_NUGET_KEY"))
        {
            Write-Host "NuGet Repository Key (GitHub Secrets -> RELOADED_NUGET_KEY) Not Specified. Skipping."
            return
        }
        $Items = Get-ChildItem -Path "$env:PUBLISH_BASE/$env:P3R_PATH/$env:PUBLISH_NUGET_PATH/*.nupkg"
        Foreach ($Item in $Items)
        {
            Write-Host "Pushing $Item"
            dotnet nuget push "$Item" -k "$env:RELOADED_NUGET_KEY" -s "$env:RELOADED_NUGET_URL" --skip-duplicate
        }